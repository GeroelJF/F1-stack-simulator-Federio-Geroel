<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Queue Data Structure Simulator</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
  <link href="style.css" rel="stylesheet">
  <script src="queue.js" defer></script>
</head>
<body>
  <main class="container col-sm-10 col-md-8 mt-4">
    <h1 class="display-7 p-3 mb-1 text-center text-bg-dark">
      Queue Data Structure Simulator
    </h1>

    <div class="row text-bg-success p-3 mb-1 text-center">
      <div class="col fs-4">Operations</div>
      <div class="col fs-4">Queue Data</div>
      <div class="col fs-4">Deleted from Queue</div>
    </div>

    <div class="row bg-danger">
      <section class="col bg-light p-2">
        <div class="d-grid gap-2">
          <input type="text" id="queue_data" class="form-control text-center mt-2"
                 placeholder="Enter a value" aria-label="Queue value">
          <button id="btn_enqueue" class="btn btn-success" type="button">Enqueue</button>
          <button id="btn_dequeue" class="btn btn-danger" type="button">Dequeue</button>
          <button id="btn_peek" class="btn btn-warning" type="button">Peek Front</button>
          <button id="btn_clear" class="btn btn-secondary" type="button">Clear</button>
        </div>
        <p id="message" class="text-center mt-3 mb-1" role="status" aria-live="polite">
          Enter a value and click Enqueue.
        </p>
      </section>

      <section class="col bg-dark text-white p-3">
        <div class="d-flex justify-content-between mb-2">
          <strong>FRONT (TOP)</strong>
          <strong>REAR (BOTTOM)</strong>
        </div>
        <div id="queue" class="queue-display" aria-label="Queue contents">
          <p class="text-center text-white-50 empty-label">Queue is empty</p>
        </div>
        <p class="text-center mt-2 mb-0 small">Items are arranged from FRONT (Top) to REAR (Bottom).</p>
      </section>

      <section class="col popped p-3" id="dequeued">
        <p class="text-center text-dark empty-label">No deleted items</p>
      </section>
    </div>
  </main>
</body>
</html>
